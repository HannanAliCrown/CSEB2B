name: cse_b2b
description: "Crown Solar Energy mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  intl: ^0.20.3
  provider: ^6.1.5+1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  lucide_icons_flutter: ^3.1.20
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.2
  image_picker: ^1.2.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dependency_overrides:
  # 14.x compiles against the canary Android SDK 37, which the local SDK
  # manager installs with metadata AGP cannot resolve. 13.0.1 is the last
  # release that builds against SDK 36 and has the same Dart API.
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
