name: Deploy to Firebase App Distribution

# Every push to the mock deployment branch ships a build to testers. Nothing
# else triggers it, so work on other branches never reaches a tester's phone.
# workflow_dispatch is kept so a build can be re-sent without an empty commit.
on:
  push:
    branches: [deployment_mock]
  workflow_dispatch:

# A second push while a build is running cancels the first: testers want the
# newest build, not every intermediate one.
concurrency:
  group: app-distribution-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Not a secret: an App ID is embedded in every copy of a distributed app.
  # What guards App Distribution is the service account key, which is.
  FIREBASE_APP_ID: 1:540100684440:android:b515bbff648c1b580dbeed

jobs:
  distribute:
    name: Build and distribute APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # `push` above already limits this to one branch, but the Actions tab
    # offers "Run workflow" against any branch. This makes the branch the
    # single rule for both, so nothing else can ever reach a tester's phone.
    if: github.ref == 'refs/heads/deployment_mock'

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches the sourceCompatibility the Android module is built with.
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed against, so a new
          # stable release cannot change a tester build without a commit.
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # prototype_server is a separate Dart package, and `flutter analyze`
      # covers the whole repository. Without its own dependencies resolved,
      # every import in it reports as missing and analysis fails on code the
      # app does not even ship.
      - name: Install prototype_server dependencies
        working-directory: prototype_server
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Golden tests render text, and a CI runner's font rasterisation differs
      # from a developer machine's, so they are excluded here rather than
      # failing every build for a reason that is not a defect.
      - name: Test
        run: flutter test --exclude-tags golden test/

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/deployment.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          # The alias is fixed in build.gradle.kts and the key shares the
          # store's password, so this is the only signing secret besides the
          # keystore itself.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Confirm the APK is signed with the release key
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "CN=" || true
          # A build that fell back to the debug key would update nothing on a
          # tester's phone, so it must never reach App Distribution.
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key, not the release key."
            exit 1
          fi

      - name: Write the service account credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. See docs/deployment.md."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          npm install --global firebase-tools@13
          printf 'Branch %s\nCommit %s\n\n%s\n' \
            "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" \
            "$(git log -1 --pretty=%s)" > "$RUNNER_TEMP/notes.txt"
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file "$RUNNER_TEMP/notes.txt"

      - name: Remove the credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json" "$RUNNER_TEMP/keystore.jks"

      # Kept for 14 days so a tester report can be matched to the exact binary
      # that produced it.
      - name: Keep the APK with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: ignore
