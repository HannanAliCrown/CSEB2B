# Windows AF_UNIX quirk on this profile: java.io.tmpdir resolves to the 8.3 short
# path C:\Users\MCFF2~1.HAN\AppData\Local\Temp. AF_UNIX bind() succeeds there but
# connect() fails with "Invalid argument", so Selector.open() -- and therefore
# every Gradle daemon handshake -- dies with "Unable to establish loopback
# connection". Pointing the JDK's AF_UNIX socket dir at a short, non-8.3 path
# fixes it. NOTE: org.gradle.jvmargs only configures the daemon, not the Gradle
# launcher, so the same flag must also be exported as JAVA_TOOL_OPTIONS:
#   set JAVA_TOOL_OPTIONS=-Djdk.net.unixdomain.tmpdir=C:\gradle-sock
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:\gradle-sock

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
