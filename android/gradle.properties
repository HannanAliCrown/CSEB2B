# The JVM builds its internal NIO pipe on an AF_UNIX socket placed in the user
# temp directory. On this Windows profile that path fails to connect, so every
# Selector.open() — and therefore every Gradle daemon handshake — dies with
# "Unable to establish loopback connection". Point the socket at a short path.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:\\gradle-sock

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
